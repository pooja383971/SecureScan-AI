version: "3.9"

services:

  mysql:

    image: mysql:8

    container_name: securescan-mysql

    restart: always

    environment:

      MYSQL_ROOT_PASSWORD: root

      MYSQL_DATABASE: securescan_db

    ports:

      - "3306:3306"

    volumes:

      - mysql-data:/var/lib/mysql

volumes:

  mysql-data: